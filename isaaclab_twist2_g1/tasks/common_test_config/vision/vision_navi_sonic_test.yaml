name: vision_navi_sonic_test
description: Test-only SONIC eval config with vision light randomization for SmallWarehouse VisionNavigation.
task_name: Isaac-Move-SmallWarehouse-VisionNavigation-G129-Dex3-Wholebody
backend: sonic

test_defaults:
  seeds: [0, 1, 2]
  repeats_per_seed: 20
  persistent_sim: true
  episode_seed_formula: sha256(task_name|group_seed|repeat_idx)_positive_int32

  vision_randomization:
    enabled: true
    debug_logging: true
    prim_path: "/World/light"
    setup:
      color: [0.75, 0.75, 0.75]
      intensity: 5000.0
      angle: 15.0
      position: [-4.0, -1.0, 18.0]
      rotation: [0.0, 0.0, 0.0]
    rotation:
      yaw_deg: [-180.0, 180.0]
      pitch_deg: [-25.0, 25.0]
      roll_deg: [-10.0, 10.0]
    intensity_range: [3000.0, 7000.0]
    color_range:
      r: [0.65, 0.85]
      g: [0.65, 0.85]
      b: [0.65, 0.85]
    room_rect_lights:
      enabled: true
      root_keywords: ["Room", "cell_light_bars"]
      expected_count_per_env: 8
      disable_count: 4
      disabled_intensity: 0.0
      enabled_intensity_scale_range: [0.65, 1.25]
      color_range:
        r: [0.70, 1.00]
        g: [0.70, 1.00]
        b: [0.65, 0.95]

overrides:
  sim:
    dt: 0.005
  decimation: 4
  object_reset_seed_source: env_seed
  target_sign_startup_randomization_enabled: true
  target_sign_reset_randomization_enabled: true
  target_sign_static_collision_patch_enabled: true
  target_sign_debug_pose_logging: true
  obstacle_01_a_layout_x_range: [-0.5, -0.4]
  obstacle_01_b_layout_x_range: [-2.2, -1.7]
  obstacle_01_c_layout_x_range: [-4.6, -4.5]
  obstacle_02_a_layout_x_range: [-1.8, -0.7]
  obstacle_02_b_layout_x_range: [-5.2, -4.0]
  obstacle_02_c_layout_x_range: [-3.1, -2.0]
  obstacle_layout_y_range: [-2.5, -1.2]
  obstacle_layout_yaw_range: [-0.785398, 0.785398]
  obstacle_01_a_layout_z: 0.16
  obstacle_01_b_layout_z: 0.56
  obstacle_01_c_layout_z: 1.06
  obstacle_02_a_layout_z: 1.56
  obstacle_02_b_layout_z: 1.3
  obstacle_02_c_layout_z: 1.8
  deterministic_object_resets:
    - record_name: target_sign
      prim_paths: ["/World/envs/env_{env_idx}/TargetSign"]
      allow_prroot_fallback: false
      prim_pose_write_mode: components
      pose_range:
        x: [-3.0, -1.5]
        y: [-0.12, 0.8]
        z: [0.0, 0.0]
        yaw: [-0.3, 0.3]
      zero_velocity_on_reset: true
    - record_name: obstacle_01_a
      prim_paths: ["/World/envs/env_{env_idx}/Obstacle01_A"]
      allow_prroot_fallback: false
      prim_pose_write_mode: local_matrix
      zero_velocity_on_reset: true
    - record_name: obstacle_01_b
      prim_paths: ["/World/envs/env_{env_idx}/Obstacle01_B"]
      allow_prroot_fallback: false
      prim_pose_write_mode: local_matrix
      zero_velocity_on_reset: true
    - record_name: obstacle_01_c
      prim_paths: ["/World/envs/env_{env_idx}/Obstacle01_C"]
      allow_prroot_fallback: false
      prim_pose_write_mode: local_matrix
      zero_velocity_on_reset: true
    - record_name: obstacle_02_a
      prim_paths: ["/World/envs/env_{env_idx}/Obstacle02_A"]
      allow_prroot_fallback: false
      prim_pose_write_mode: local_matrix
      zero_velocity_on_reset: true
    - record_name: obstacle_02_b
      prim_paths: ["/World/envs/env_{env_idx}/Obstacle02_B"]
      allow_prroot_fallback: false
      prim_pose_write_mode: local_matrix
      zero_velocity_on_reset: true
    - record_name: obstacle_02_c
      prim_paths: ["/World/envs/env_{env_idx}/Obstacle02_C"]
      allow_prroot_fallback: false
      prim_pose_write_mode: local_matrix
      zero_velocity_on_reset: true
