name: real_scene_odin1_colmap_independent_repaired_3dgrut_30k_lidar_collision_football_vla_smoke_sonic
description: Fixed-horizon SONIC VLA smoke for repaired independent COLMAP 3DGRUT 30k with LiDAR collision.
task_name: Isaac-Move-Football-Single-G129-Dex3-Wholebody
backend: sonic

test_defaults:
  seeds: [0]
  repeats_per_seed: 1
  persistent_sim: true

overrides:
  wait_for_textures: false
  sim:
    dt: 0.005
  decimation: 4

  object_reset_seed_source: env_seed
  deterministic_object_resets:
    - record_name: football
      scene_keys: [object, football]
      pose_range:
        x: [-2.74, -2.74]
        y: [-3.25, -3.25]
        z: [0.11, 0.11]
      zero_velocity_on_reset: true

  scene:
    room:
      spawn:
        usd_path: ${PROJECT_ROOT}/assets/objects/real_scene/odin1_colmap_independent_repaired_3dgrut_30k_lidar_collision_scene.usda
      init_state:
        pos: [0.0, 0.0, 0.0]
        rot: [1.0, 0.0, 0.0, 0.0]

    robot:
      init_state:
        # Places the head camera near training frame_001232 and faces the open play area.
        pos: [-1.27, -2.98, 0.789]
        rot: [0.0805, 0.0, 0.0, -0.9968]

    object:
      init_state:
        pos: [-2.74, -3.25, 0.11]
        rot: [1.0, 0.0, 0.0, 0.0]

    ground: null
    goal_net: null
    goal_backdrop_1: null
    goal_backdrop_2: null
    goal_backdrop_3: null
    goal_backdrop_4: null

    light:
      spawn:
        intensity: 6000.0

    robot_key_light:
      init_state:
        pos: [-1.75, -3.10, 2.2]
        rot: [1.0, 0.0, 0.0, 0.0]
      spawn:
        intensity: 8000.0
        radius: 1.0

    auto_tube_light_00: null
    auto_tube_light_01: null
    auto_tube_light_02: null
    auto_tube_light_03: null
    auto_tube_light_04: null
    auto_tube_light_05: null
    auto_tube_light_06: null
    auto_tube_light_07: null
    auto_tube_light_08: null
    auto_tube_light_09: null
    auto_tube_light_10: null
    auto_tube_light_11: null
