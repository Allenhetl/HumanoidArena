name: real_scene_odin_mvs_tuned_200_football_sonic
description: Tuned-200 MVSAnywhere colored mesh real-scene background with football; VLA comparison config using ipark XY and identity room transform.
task_name: Isaac-Move-Football-Single-G129-Dex3-Wholebody
backend: sonic

overrides:
  sim:
    dt: 0.005
  decimation: 4

  object_reset_seed_source: env_seed
  deterministic_object_resets:
    - record_name: football
      scene_keys: [object, football]
      pose_range:
        x: [-3.239, -3.239]
        y: [-3.225, -3.225]
        # Tuned-200 MVS local floor near ipark robot XY: z ~= -1.15; ball center offset +0.11.
        z: [-1.040, -1.040]
      zero_velocity_on_reset: true

  scene:
    room:
      spawn:
        usd_path: ${PROJECT_ROOT}/assets/objects/real_scene/odin_mvsanywhere_tuned_200_mesh.usda
      init_state:
        pos: [0.0, 0.0, 0.0]
        rot: [1.0, 0.0, 0.0, 0.0]

    robot:
      init_state:
        # ipark XY for alignment. z = floor_z(-1.15) + ipark pelvis-floor offset(0.789).
        pos: [-3.239, -4.425, -0.361]
        rot: [0.7071, 0.0, 0.0, 0.7071]

    object:
      init_state:
        pos: [-3.239, -3.225, -1.040]
        rot: [1.0, 0.0, 0.0, 0.0]

    # Keep a thin kinematic physics floor because the MVS mesh is visual-only.
    # Center at floor_z - thickness/2 = -1.15 - 0.005.
    ground:
      init_state:
        pos: [0.0, 0.0, -1.155]
        rot: [1.0, 0.0, 0.0, 0.0]

    goal_net: null
    goal_backdrop_1: null
    goal_backdrop_2: null
    goal_backdrop_3: null
    goal_backdrop_4: null

    light:
      spawn:
        intensity: 8000.0

    robot_key_light: null
