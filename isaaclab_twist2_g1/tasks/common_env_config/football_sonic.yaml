name: football_sonic
description: SONIC env config for Isaac-Move-Football-G129-Dex3-Wholebody.
task_name: Isaac-Move-Football-G129-Dex3-Wholebody
backend: sonic

overrides:
  sim:
    dt: 0.005
  decimation: 4
  object_reset_seed_source: time
  deterministic_object_resets:
    - record_name: football
      scene_keys: [object, football]
      pose_range:
        x: [-1.5, 1.5]
        y: [-1.5, 1.5]
      zero_velocity_on_reset: true
