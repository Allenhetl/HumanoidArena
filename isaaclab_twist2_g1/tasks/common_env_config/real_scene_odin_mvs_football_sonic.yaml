name: real_scene_odin_mvs_football_sonic
description: MVSAnywhere colored mesh real-scene background with only the football interaction object loaded; first pass uses ipark XY and identity room transform.
task_name: Isaac-Move-Football-Single-G129-Dex3-Wholebody
backend: sonic

overrides:
  sim:
    dt: 0.005
  decimation: 4

  object_reset_seed_source: env_seed
  deterministic_object_resets:
    - record_name: football
      scene_keys: [object, football]
      pose_range:
        x: [-3.239, -3.239]
        y: [-3.225, -3.225]
        # MVS local floor candidate near robot XY: z ~= 0.33; ball center offset copied from ipark: +0.11.
        z: [0.440, 0.440]
      zero_velocity_on_reset: true

  scene:
    room:
      spawn:
        usd_path: ${PROJECT_ROOT}/assets/objects/real_scene/odin_mvsanywhere_full_mesh.usda
      init_state:
        pos: [0.0, 0.0, 0.0]
        rot: [1.0, 0.0, 0.0, 0.0]

    robot:
      init_state:
        # ipark XY requested for first MVS alignment smoke test.
        # z uses local MVS floor candidate around z ~= 0.33 plus ipark pelvis-floor offset ~= 0.789.
        pos: [-3.239, -4.425, 1.119]
        rot: [0.7071, 0.0, 0.0, 0.7071]

    object:
      init_state:
        pos: [-3.239, -3.225, 0.440]
        rot: [1.0, 0.0, 0.0, 0.0]

    # Keep a thin kinematic physics floor because the MVS mesh is visual-only.
    # Center it at floor_z - thickness/2 = 0.33 - 0.005.
    ground:
      init_state:
        pos: [0.0, 0.0, 0.325]
        rot: [1.0, 0.0, 0.0, 0.0]
    goal_net: null
    goal_backdrop_1: null
    goal_backdrop_2: null
    goal_backdrop_3: null
    goal_backdrop_4: null

    light:
      spawn:
        intensity: 8000.0

    robot_key_light: null
