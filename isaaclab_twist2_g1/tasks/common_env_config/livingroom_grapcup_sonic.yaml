name: livingroom_grapcup_sonic
description: SONIC env config for Isaac-Move-ArtVIP-Livingroom-GrapCup-G129-Dex3-Wholebody.
task_name: Isaac-Move-ArtVIP-Livingroom-GrapCup-G129-Dex3-Wholebody
backend: sonic

